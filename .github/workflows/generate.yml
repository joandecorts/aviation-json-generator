name: Generate aviation JSON

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate and publish aviation JSON
        run: |
          python generate_aviation.py

      - name: Commit cache if changed
        run: |
          if git diff --quiet -- data/aviation_last.json; then
            echo "No cache changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/aviation_last.json
            git commit -m "Update aviation_last.json"
            git push
          fi
